[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "academic-harness-new"
version = "0.1.0"
description = "Research Harness foundation with the retained literature lifecycle"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6"]

[project.optional-dependencies]
dev = ["pytest>=8", "tomli>=2; python_version < '3.11'"]

[project.scripts]
academic-harness = "harness.__main__:main"

[tool.setuptools]
packages = ["harness"]

[tool.pytest.ini_options]
testpaths = ["checks", "vendor/aris/tests"]
