{
  "schema_version": 1,
  "context_budget": {
    "active_packet_max_chars": 24000,
    "review_bundle_max_chars": 32000,
    "max_evidence_cards": 12,
    "max_unresolved_issue_ids": 8,
    "history_policy": "paths-and-ids-only"
  },
  "research_effort_budget": {
    "max_search_cycles": 8,
    "max_queries": 80,
    "max_fulltext_papers": 80
  },
  "research_lit": {
    "controller": "arisctl.controller.ARISController",
    "stages": [
      "SOURCE_POLICY_DRAFTING",
      "WAITING_FOR_HUMAN",
      "QUERY_PLANNING",
      "METADATA_RETRIEVAL",
      "HUMAN_SEARCH_REQUIRED",
      "PAPER_READING",
      "FIELD_SYNTHESIS",
      "COVERAGE_REVIEW",
      "LANDSCAPE_ACCEPTED"
    ],
    "allowed_actions": {
      "SOURCE_POLICY_DRAFTING": [
        "submit_source_admission_policy"
      ],
      "WAITING_FOR_HUMAN": [
        "human_approve",
        "request_source_policy_revision"
      ],
      "QUERY_PLANNING": [
        "submit_query_plan"
      ],
      "METADATA_RETRIEVAL": [
        "execute_query",
        "register_user_source",
        "decide_admission",
        "select_reading_subset",
        "finish_retrieval"
      ],
      "HUMAN_SEARCH_REQUIRED": [
        "submit_human_search_results",
        "submit_human_fulltext_batch"
      ],
      "PAPER_READING": [
        "read_full_text",
        "submit_evidence_card",
        "select_reading_subset",
        "finish_reading"
      ],
      "FIELD_SYNTHESIS": [
        "submit_field_map",
        "select_formal_primary_subset"
      ],
      "COVERAGE_REVIEW": [
        "submit_coverage_review"
      ],
      "LANDSCAPE_ACCEPTED": [
        "request_literature_update",
        "literature_handoff"
      ]
    },
    "allowed_agents": {
      "SOURCE_POLICY_DRAFTING": [
        "main_research_agent"
      ],
      "WAITING_FOR_HUMAN": [],
      "QUERY_PLANNING": [
        "main_research_agent"
      ],
      "METADATA_RETRIEVAL": [
        "main_research_agent"
      ],
      "HUMAN_SEARCH_REQUIRED": [],
      "PAPER_READING": [
        "main_research_agent",
        "paper_reader"
      ],
      "FIELD_SYNTHESIS": [
        "main_research_agent"
      ],
      "COVERAGE_REVIEW": [
        "coverage_reviewer"
      ],
      "LANDSCAPE_ACCEPTED": [
        "main_research_agent"
      ]
    },
    "coverage_review_triggers": [
      "candidate_sufficient",
      "major_taxonomy_change",
      "final_acceptance"
    ],
    "canonicalization": "staging_then_validator_then_controller_acceptance",
    "ledger_source": "gateway_events_only"
  },
  "terminal_statuses": [
    "accepted",
    "human_accepted",
    "skipped"
  ],
  "workflow_id": "academic-research-cycle-v1",
  "mode": "research_cycle",
  "description": "Shared literature, human-selected problem and concrete-method research cycle; optional RCA and principle reasoning.",
  "artifact_manifest": {
    "active_field_map": "idea-stage/ACTIVE_FIELD_MAP.md",
    "evidence_registry": "idea-stage/EVIDENCE_REGISTRY.jsonl",
    "literature_corpus": "idea-stage/LITERATURE_CORPUS.jsonl",
    "source_admission_policy": "idea-stage/SOURCE_ADMISSION_POLICY.yaml",
    "search_log": "idea-stage/SEARCH_LEDGER.jsonl"
  },
  "phases": [
    {
      "phase": "landscape",
      "depends_on": [],
      "required_inputs": [],
      "produced_artifacts": [
        "@artifact:active_field_map",
        "@artifact:evidence_registry",
        "@artifact:literature_corpus",
        "@artifact:source_admission_policy",
        "@artifact:search_log"
      ],
      "gate_id": "landscape_sufficiency",
      "gate_owner": "research-lit",
      "formal_gate": true,
      "human_checkpoint": false
    }
  ],
  "research_cycle": {
    "controller": "harness.scientific_controller.ScientificController",
    "reviewer_role": "scientific_reviewer",
    "problem_selection": "explicit_human_command",
    "allowed_actions": {
      "NOT_STARTED": [
        "begin"
      ],
      "PROBLEM_DISCOVERY": [
        "submit_problems",
        "submit_prior_assessment",
        "request_literature_update"
      ],
      "PROBLEM_REVIEW": [
        "review_handoff",
        "submit_review",
        "request_literature_update"
      ],
      "PROBLEM_SELECTION": [
        "human_select_problem",
        "reopen_problem",
        "request_literature_update"
      ],
      "METHOD_DESIGN": [
        "submit_method",
        "submit_check",
        "submit_prior_assessment",
        "request_literature_update",
        "reopen_problem"
      ],
      "METHOD_REVIEW": [
        "review_handoff",
        "submit_review",
        "submit_check",
        "submit_prior_assessment",
        "request_literature_update",
        "reopen_problem"
      ],
      "METHOD_READY": [
        "human_confirm_method",
        "submit_check",
        "submit_prior_assessment",
        "request_literature_update",
        "reopen_problem"
      ],
      "LITERATURE_UPDATE": [
        "retained_literature_actions_until_coverage_accepted"
      ],
      "METHOD_CONFIRMED": [
        "handoff",
        "reopen_problem"
      ]
    },
    "returns": {
      "covering_in_field_prior": "literature_update_then_problem_discovery",
      "cross_field_mature_method": "mechanism_resource_in_method_design",
      "supplementary_literature": "resume_suspended_scientific_work_with_feedback"
    },
    "checks": {
      "kinds": [
        "THEORY",
        "DESIGN_SELECTION",
        "INDEPENDENT_VALIDATION"
      ],
      "results": "performed_artifacts_bound_to_problem_route_claim_and_plan",
      "claim_boundary": "design_selection_is_not_independent_contribution_validation"
    }
  }
}
